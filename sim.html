<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mô phỏng Danh bạ — Thực hành</title>
<meta name="description" content="Mô phỏng ứng dụng Danh bạ trên iPhone và Android dành cho học sinh thực hành lưu số điện thoại." />
<link rel="stylesheet" href="styles.css?v=7" />
<link rel="stylesheet" href="call-message.css?v=7" />
</head>
<body data-page="sim">

<!-- ============ TRANG 2: SÂN KHẤU MÔ PHỎNG ============ -->
<div class="stage" id="stage">
  <div class="lab-bar">
    <a class="lab-btn" id="btn-switch-os" href="index.html">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Đổi hệ điều hành
    </a>
    <div class="lab-title" id="lab-title">iOS</div>
    <button class="lab-btn lab-btn--ghost" id="btn-reset" type="button">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Đặt lại dữ liệu
    </button>
  </div>

  <div class="device-wrap" id="device-wrap">
    <div class="device" id="device">
      <div class="device-side device-side--vol-up"></div>
      <div class="device-side device-side--vol-down"></div>
      <div class="device-side device-side--power"></div>
      <div class="screen" id="screen"></div>
      <div class="island" id="island" aria-hidden="true"></div>
      <div class="punch" id="punch" aria-hidden="true"></div>
      <div class="home-indicator" id="home-indicator" aria-hidden="true"></div>
    </div>
  </div>

  <div class="lab-hint" id="lab-hint">Chạm vào biểu tượng <strong>Danh bạ</strong> trên màn hình để bắt đầu.</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<input type="file" id="avatar-file" accept="image/*" hidden />

<script src="app.js?v=6"></script>
<script src="call-message.js?v=4"></script>
</body>
</html>
