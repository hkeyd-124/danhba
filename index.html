<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mô phỏng Danh bạ — iOS &amp; Android</title>
<meta name="description" content="Mô phỏng ứng dụng Danh bạ trên iPhone và Android dành cho học sinh thực hành lưu số điện thoại." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============ MÀN HÌNH CHỌN HỆ ĐIỀU HÀNH ============ -->
<div class="chooser" id="chooser">
  <div class="chooser-bg" aria-hidden="true"></div>

  <div class="chooser-inner">
    <header class="chooser-head">
      <div class="chooser-badge">Bài thực hành</div>
      <h1>Mô phỏng <span>Danh bạ</span></h1>
      <p>Chọn hệ điều hành để bắt đầu thực hành lưu số điện thoại.</p>
    </header>

    <div class="os-grid">
      <button class="os-card" data-os="ios" type="button">
        <div class="os-preview os-preview--ios" aria-hidden="true">
          <div class="mini-device mini-ios">
            <div class="mini-island"></div>
            <div class="mini-status"><span>9:41</span><span class="mini-dots"></span></div>
            <div class="mini-title">Danh bạ</div>
            <div class="mini-search"></div>
            <div class="mini-row"><i class="mini-av a1"></i><span></span></div>
            <div class="mini-row"><i class="mini-av a2"></i><span></span></div>
            <div class="mini-row"><i class="mini-av a3"></i><span></span></div>
            <div class="mini-row"><i class="mini-av a4"></i><span></span></div>
            <div class="mini-bar"></div>
          </div>
        </div>
        <div class="os-meta">
          <div class="os-name">iOS</div>
          <div class="os-sub">iPhone · iPad</div>
        </div>
        <div class="os-go" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </button>

      <button class="os-card" data-os="android" type="button">
        <div class="os-preview os-preview--android" aria-hidden="true">
          <div class="mini-device mini-android">
            <div class="mini-punch"></div>
            <div class="mini-status"><span>9:41</span><span class="mini-dots"></span></div>
            <div class="mini-title">Danh bạ</div>
            <div class="mini-search mini-search--pill"></div>
            <div class="mini-row"><i class="mini-av a1"></i><span></span></div>
            <div class="mini-row"><i class="mini-av a2"></i><span></span></div>
            <div class="mini-row"><i class="mini-av a3"></i><span></span></div>
            <div class="mini-row"><i class="mini-av a4"></i><span></span></div>
            <div class="mini-fab"></div>
            <div class="mini-gesture"></div>
          </div>
        </div>
        <div class="os-meta">
          <div class="os-name">Android</div>
          <div class="os-sub">Samsung · Xiaomi · Pixel</div>
        </div>
        <div class="os-go" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </button>
    </div>

    <p class="chooser-note">Dữ liệu danh bạ được lưu ngay trên máy này. Bạn có thể đổi hệ điều hành bất cứ lúc nào.</p>
  </div>
</div>

<!-- ============ SÂN KHẤU MÔ PHỎNG ============ -->
<div class="stage" id="stage" hidden>
  <div class="lab-bar">
    <button class="lab-btn" id="btn-switch-os" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Đổi hệ điều hành
    </button>
    <div class="lab-title" id="lab-title">iOS</div>
    <button class="lab-btn lab-btn--ghost" id="btn-reset" type="button">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Đặt lại dữ liệu
    </button>
  </div>

  <div class="device-wrap" id="device-wrap">
    <div class="device" id="device">
      <div class="device-side device-side--vol-up"></div>
      <div class="device-side device-side--vol-down"></div>
      <div class="device-side device-side--power"></div>
      <div class="screen" id="screen"></div>
      <div class="island" id="island" aria-hidden="true"></div>
      <div class="punch" id="punch" aria-hidden="true"></div>
      <div class="home-indicator" id="home-indicator" aria-hidden="true"></div>
    </div>
  </div>

  <div class="lab-hint" id="lab-hint">Chạm vào biểu tượng <strong>Danh bạ</strong> trên màn hình để bắt đầu.</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
